<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Captura de página inteira</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main id="wrap" aria-live="polite">
      <section id="loading" class="state">
        <h1>Capturando a página</h1>
        <div class="progress" role="progressbar" aria-label="Progresso da captura" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="bar"></div>
        </div>
        <p id="status-text">Preparando a captura…</p>
      </section>

      <section id="result" class="state" hidden>
        <h1>Captura concluída</h1>
        <p id="result-message">A imagem está pronta.</p>
        <div class="actions">
          <button id="copy-image" type="button">Copiar imagem</button>
          <button id="open-image" type="button">Abrir imagem</button>
          <button id="capture-again" type="button" class="secondary">Capturar novamente</button>
        </div>
        <p id="feedback" class="feedback" role="status"></p>
      </section>

      <section id="error" class="state error" hidden>
        <h1>Não foi possível capturar</h1>
        <p id="error-message">Ocorreu um erro inesperado. Recarregue a página e tente novamente.</p>
        <button id="retry" type="button">Tentar novamente</button>
      </section>
    </main>
    <script src="api.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
